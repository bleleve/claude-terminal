name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/**-fork']

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [24]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Run tests
        run: npm test

      - name: Workflow laboratory
        run: npm run lab

      - name: Configure Chromium sandbox on Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Electron runtime smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:runtime

      - name: Electron runtime smoke (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run test:runtime

      - name: Cloud regressions
        if: runner.os == 'Linux'
        run: |
          npm ci --prefix cloud
          npm test --prefix cloud

      - name: Hub regressions
        if: runner.os == 'Linux'
        run: |
          npm ci --prefix hub-worker
          npm test --prefix hub-worker

      - name: Build and check packaged application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build -- --dir --publish never
          node scripts/check-package.cjs
